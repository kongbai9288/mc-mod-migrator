<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>更多页 UI 原型 1:1 — 列表 + 可见移入</title>
<style>
:root{
  --p:#0B57D0; --on-p:#fff;
  --sc:#D3E3FD; --on-sc:#0A2E6F;
  --surface:#FEFBFF; --card:#FFFFFF;
  --variant:#F0F2F5; --outline:#C4C7C5; --divider:#E7E9EB;
  --t1:#1A1C1E; --t2:#5F6368; --t3:#9AA0A6;
  --warn:#8A4B00; --warn-bg:#FCE8CD; --warn-line:#F0B86B;
  --err:#B3261E; --err-bg:#F9DEDC;
  --ok:#006C51; --ok-bg:#D7F5EA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#12151A;display:flex;justify-content:center;align-items:center;
  min-height:100vh;font-family:Roboto,"Noto Sans SC","PingFang SC",system-ui,sans-serif;padding:20px;gap:24px;flex-wrap:wrap}

.phone{position:relative;width:360px;height:800px;background:var(--surface);
  border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);flex:none}

.bar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;font-size:11px;color:var(--t1);z-index:40}
.bar .r{display:flex;align-items:center;gap:5px}
.bat{width:18px;height:9px;border:1px solid var(--t1);border-radius:2px;position:relative;padding:1px}
.bat::after{content:"";position:absolute;right:-2px;top:2px;width:1.5px;height:4px;background:var(--t1)}
.bat i{display:block;height:100%;width:31%;background:var(--t1)}

.view{position:absolute;top:26px;bottom:56px;left:0;right:0;overflow-y:auto;background:var(--surface)}
.view::-webkit-scrollbar{width:0}
.view{display:none}
.view.on{display:block}

.appbar{position:sticky;top:0;z-index:20;height:56px;background:var(--surface);
  display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--divider)}
.appbar .back{border:0;background:none;cursor:pointer;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;color:var(--t1);border-radius:50%}
.appbar h1{font-size:19px;font-weight:500;color:var(--t1)}

.srch{padding:10px 14px 6px}
.field{height:44px;border:1px solid var(--outline);border-radius:22px;display:flex;
  align-items:center;padding:0 14px;gap:8px;background:var(--card)}
.field input{border:0;outline:0;font-size:14px;color:var(--t1);flex:1;background:none;font-family:inherit}
.field input::placeholder{color:var(--t3)}
.field .x{display:none;border:0;background:none;color:var(--t2);cursor:pointer;font-size:16px;padding:0 2px}
.field.has .x{display:block}

.note{margin:10px 12px 12px;background:var(--variant);border-radius:12px;padding:11px 13px;
  font-size:12px;color:var(--t2);line-height:17px}
.note b{color:var(--t1);font-weight:600}

/* 撤销提示条 */
.snack{margin:0 12px 10px;background:var(--sc);border-radius:12px;padding:10px 12px;
  display:none;align-items:center;gap:10px;font-size:13px;color:var(--on-sc)}
.snack.on{display:flex}
.snack .tx{flex:1;line-height:17px}
.snack button{border:0;background:none;color:var(--p);font-weight:600;font-size:13px;
  cursor:pointer;font-family:inherit;padding:4px 2px}

.sec{padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--p);letter-spacing:.3px}
.grp{background:var(--card);margin:0 12px 12px;border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;min-height:64px;cursor:pointer}
.row:active{background:#F4F6F9}
.row+.row{border-top:1px solid var(--divider)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--variant);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--p)}
.ico svg{width:20px;height:20px;fill:currentColor}
.row .tx{flex:1;min-width:0;padding:10px 0}
.row .t{font-size:14px;color:var(--t1);line-height:19px}
.row .s{font-size:12px;color:var(--t2);margin-top:2px;line-height:16px}
.mv{flex:none;border:1px solid var(--outline);background:none;border-radius:10px;
  height:36px;padding:0 10px;font-size:12px;color:var(--p);cursor:pointer;font-family:inherit;
  position:relative;white-space:nowrap}
.mv::before{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px}
.mv:disabled{color:var(--t3);border-color:var(--divider);cursor:default}
.mv:disabled::before{display:none}

.full{margin:0 12px 10px;font-size:11px;color:var(--warn);line-height:16px;display:none}
.full.on{display:block}

.empty{padding:34px 20px;text-align:center;color:var(--t2);font-size:13px;display:none;line-height:19px}
.empty.on{display:block}

/* 底部栏当前项 */
.cur{margin:0 12px 12px;background:var(--card);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cur .ct{font-size:13px;font-weight:600;color:var(--t1);padding:12px 14px 6px}
.cur .ct span{font-weight:400;color:var(--t2);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.chip{background:var(--variant);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--t1)}
.chip.fix{background:var(--sc);color:var(--on-sc)}
.cur .go{width:100%;border:0;border-top:1px solid var(--divider);background:none;
  padding:12px;font-size:13px;color:var(--p);cursor:pointer;font-family:inherit;text-align:center}

/* 功能占位页 */
.ph{padding:16px}
.ph .big{width:72px;height:72px;border-radius:18px;background:var(--variant);
  display:flex;align-items:center;justify-content:center;color:var(--p);margin:8px auto 14px}
.ph .big svg{width:36px;height:36px;fill:currentColor}
.ph h2{font-size:17px;color:var(--t1);text-align:center;font-weight:600}
.ph p{font-size:13px;color:var(--t2);text-align:center;line-height:19px;margin-top:8px}

/* 底部导航 */
.nav{position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--card);
  border-top:1px solid var(--divider);display:flex;z-index:30}
.nv{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;color:var(--t3);font-family:inherit;padding:0}
.nv svg{width:22px;height:22px;fill:currentColor}
.nv span{font-size:10px}
.nv.on{color:var(--p)}

.toast{position:absolute;left:20px;right:20px;bottom:72px;background:#32363B;color:#fff;
  border-radius:10px;padding:11px 14px;font-size:13px;opacity:0;transition:opacity .18s;
  pointer-events:none;z-index:50;line-height:18px}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="phone">
  <div class="bar"><span>2:14</span><span class="r"><span>中国移动</span><span>4G</span><span class="bat"><i></i></span></span></div>

  <!-- ============ 更多页 ============ -->
  <div class="view on" id="v-more">
    <div class="appbar"><h1>更多</h1></div>

    <div class="srch">
      <div class="field" id="f1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#5F6368"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="q" placeholder="搜功能名或说明" autocomplete="off">
        <button class="x" id="qx">✕</button>
      </div>
    </div>

    <div class="note" id="note">
      这里列出<b>没放到底部导航栏</b>的功能。点右侧「移到底部」就能挪过去，移完可以撤销。<br>
      底部最多放 4 个（还要留一个给「更多」），调序和移回在<b>设置 → 底部导航栏</b>。
    </div>

    <div class="snack" id="snack">
      <span class="tx" id="snack-tx"></span>
      <button id="undo">撤销</button>
    </div>

    <div class="full" id="full">底部栏已满 4 个，先到「设置 → 底部导航栏」移一个出来，才能再移进去。</div>

    <div id="list"></div>

    <div class="empty" id="empty">所有功能都在底部栏了<br>到「设置 → 底部导航栏」可以把它们移回这里</div>

    <div class="cur" id="cur">
      <div class="ct">底部导航栏 <span id="cur-n"></span></div>
      <div class="chips" id="chips"></div>
      <button class="go" id="go-set">管理底部导航栏 · 调序 / 移回</button>
    </div>
  </div>

  <!-- ============ 功能占位页 ============ -->
  <div class="view" id="v-page">
    <div class="appbar">
      <button class="back" id="pg-back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1 id="pg-t">功能</h1>
    </div>
    <div class="ph">
      <div class="big" id="pg-ico"></div>
      <h2 id="pg-h"></h2>
      <p id="pg-p"></p>
    </div>
  </div>

  <div class="nav">
    <button class="nv" data-nav="迁移">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      <span>迁移</span>
    </button>
    <button class="nv" data-nav="市场">
      <svg viewBox="0 0 24 24"><path d="M4 4h2v16H4V4zm3 0h12l1.5 4H5.5L7 4zm-1 6h13v10H6V10zm4 2v6h5v-6h-5z"/></svg>
      <span>市场</span>
    </button>
    <button class="nv on" data-nav="更多">
      <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span>更多</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
var IC = {
  mods:'<path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3 6.5 3.6L12 11.5 5.5 7.9 12 4.3zM5 9.6l6 3.3v6.9l-6-3.3V9.6zm8 10.2v-6.9l6-3.3v6.9l-6 3.3z"/>',
  update:'<path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 6 20a6 6 0 0 0 5.09-2.87l-.09-.13H11v-2h4v4h-1.4l-.32-.57A4 4 0 0 1 6 18a4 4 0 0 1 .84-6.13l1.2-.64-.24-1.35A5.5 5.5 0 0 1 12 6a5.48 5.48 0 0 1 5.32 4.13l.42 1.7 1.73.5A3.5 3.5 0 0 1 18.5 19H17v2h1.5a5.5 5.5 0 0 0 .85-10.96z"/>',
  tools:'<path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"/>',
  favorites:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.4-3.9 3.9-1.5-1.5 3.9-3.9-3.9-3.9 1.5-1.5 3.9 3.9 3.9-3.9 1.5 1.5-3.9 3.9 3.9 3.9-1.5 1.5-3.9-3.9z"/>',
  devs:'<path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/>',
  feed:'<path d="M3 3h18v6H3V3zm0 8h18v10H3V11zm3 2v2h12v-2H6zm0 4v2h8v-2H6z"/>',
  weekly:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.7-4-2.3V7z"/>',
  server:'<path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6c0 1.6-.6 3-1.6 4.1l1.5 1.5A8 8 0 0 0 20 12a8 8 0 0 0-8-8zm0 14a6 6 0 0 1-6-6c0-1.6.6-3 1.6-4.1L6.1 6.4A8 8 0 0 0 4 12a8 8 0 0 0 8 8v3l4-4-4-4v3z"/>',
  sync:'<path d="M4 6h16v10H4V6zm2 2v6h12V8H6zm-2 12h16v2H4v-2z"/>',
  sites:'<path d="M14 3v2h3.6l-8.3 8.3 1.4 1.4L19 6.4V10h2V3h-7zM5 5h5V3H3v18h18v-7h-2v5H5V5z"/>',
  plugin:'<path d="M10 2a3 3 0 0 1 3 3v1h2a2 2 0 0 1 2 2v1a3 3 0 0 1 0 6v1a2 2 0 0 1-2 2h-2v1a3 3 0 0 1-6 0v-1H5a2 2 0 0 1-2-2v-1a3 3 0 0 1 0-6V8a2 2 0 0 1 2-2h2V5a3 3 0 0 1 3-3zm0 2a1 1 0 0 0-1 1v4H5v2a1 1 0 0 0 0 2v2h4v4a1 1 0 0 0 2 0v-4h4v-2a1 1 0 0 0 0-2V9h-4V5a1 1 0 0 0-1-1z"/>',
  trash:'<path d="M9 3v1H4v2h16V4h-5V3H9zM6 7v14h12V7H6zm3 3h2v8H9v-8zm4 0h2v8h-2v-8z"/>',
  settings:'<path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3H9l-.3 2.9c-.6.2-1.2.6-1.7 1l-2.4-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1L9 21h6l.3-2.9c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.7zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>',
  log:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>',
  skin:'<path d="M12 2C7 2 4 5 4 9v3h16V9c0-4-3-7-8-7zM6 14v6H4v2h16v-2h-2v-6H6zm3 0h6v6H9v-6z"/>'
};

var GROUPS = ['常用','商店与社区','服务器与传输','工具与文件','设置与其他','其他'];

var ALL = [
  {k:'mods',      n:'模组管理',   s:'启用 / 禁用 / 删除已装的模组',           g:'常用'},
  {k:'update',    n:'整合包更新', s:'检查装过的整合包有没有新版本',           g:'常用'},
  {k:'tools',     n:'工具箱',     s:'体检、导出整合包、看 NBT 等 17 个工具',  g:'常用'},
  {k:'favorites', n:'收藏夹',     s:'收藏的模组和链接',                       g:'常用'},
  {k:'devs',      n:'开发者名单', s:'参与这个项目的人',                       g:'商店与社区'},
  {k:'feed',      n:'MC 资讯',    s:'几个站的最新消息汇总',                   g:'商店与社区'},
  {k:'weekly',    n:'周报',       s:'本周模组和更新汇总',                     g:'商店与社区'},
  {k:'server',    n:'服务器',     s:'连服务器比对并下载模组',                 g:'服务器与传输'},
  {k:'sync',      n:'同步',       s:'用 GitHub 账号同步配置和列表',           g:'服务器与传输'},
  {k:'sites',     n:'站点导航',   s:'常用站点直达',                           g:'服务器与传输'},
  {k:'plugin',    n:'插件',       s:'插件的装、跑、启停、卸载',               g:'工具与文件'},
  {k:'trash',     n:'回收站',     s:'删掉的文件，30 天内可以还原',            g:'工具与文件'},
  {k:'settings',  n:'设置',       s:'全部设置项都在这里',                     g:'设置与其他'},
  {k:'log',       n:'运行日志',   s:'看崩溃记录和调试日志',                   g:'设置与其他'},
  {k:'skin',      n:'玩家皮肤',   s:'按名字查正版玩家的皮肤和披风',           g:'其他'}
];

// 底部栏：迁移 / 市场 是默认已放的，最多 4 个
var bottom = ['迁移','市场'];

function svg(k){ return '<svg viewBox="0 0 24 24">'+(IC[k]||IC.log)+'</svg>'; }

function render(){
  var q = (document.getElementById('q').value||'').trim().toLowerCase();
  var box = document.getElementById('list');
  box.innerHTML='';
  var shown = 0;
  GROUPS.forEach(function(g){
    var items = ALL.filter(function(p){
      if(bottom.indexOf(p.n)>=0) return false;
      if(p.g!==g) return false;
      if(q && (p.n+' '+p.s).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    if(!items.length) return;
    shown += items.length;
    var h = '<div class="sec">'+g+'</div><div class="grp">';
    items.forEach(function(p){
      var full = bottom.length>=4;
      h += '<div class="row" data-k="'+p.k+'">'+
             '<div class="ico">'+svg(p.k)+'</div>'+
             '<div class="tx" data-open="'+p.k+'"><div class="t">'+p.n+'</div><div class="s">'+p.s+'</div></div>'+
             '<button class="mv" data-mv="'+p.k+'"'+(full?' disabled':'')+'>移到底部</button>'+
           '</div>';
    });
    box.insertAdjacentHTML('beforeend', h+'</div>');
  });
  document.getElementById('empty').className = 'empty'+(shown?'':' on');
  document.getElementById('note').style.display = q ? 'none' : '';
  document.getElementById('full').className = 'full'+(bottom.length>=4?' on':'');

  // 底部栏当前项
  var cc = document.getElementById('chips');
  cc.innerHTML='';
  bottom.forEach(function(n){ cc.insertAdjacentHTML('beforeend','<span class="chip">'+n+'</span>'); });
  cc.insertAdjacentHTML('beforeend','<span class="chip fix">更多</span>');
  document.getElementById('cur-n').textContent = '（'+bottom.length+' / 4）';
}

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.className='toast on';
  clearTimeout(window._tt); window._tt=setTimeout(function(){t.className='toast';},1800);
}

document.getElementById('list').addEventListener('click', function(e){
  var mv = e.target.closest('[data-mv]');
  if(mv){
    var k = mv.getAttribute('data-mv');
    if(bottom.length>=4){ toast('底部已满 4 个，先移一个出来'); return; }
    var p = ALL.filter(function(x){return x.k===k;})[0];
    p._in = true;
    bottom.push(p.n);
    window._last = k;
    var sn=document.getElementById('snack');
    document.getElementById('snack-tx').textContent='已把「'+p.n+'」移到底部';
    sn.className='snack on';
    render();
    return;
  }
  var op = e.target.closest('[data-open]');
  if(op){
    var k2 = op.getAttribute('data-open');
    var p2 = ALL.filter(function(x){return x.k===k2;})[0];
    document.getElementById('pg-t').textContent=p2.n;
    document.getElementById('pg-h').textContent=p2.n;
    document.getElementById('pg-p').textContent=p2.s+'。这里是这个功能自己的页面。';
    document.getElementById('pg-ico').innerHTML=svg(p2.k);
    document.getElementById('v-more').className='view';
    document.getElementById('v-page').className='view on';
    return;
  }
});

document.getElementById('undo').addEventListener('click', function(){
  if(!window._last) return;
  var p = ALL.filter(function(x){return x.k===window._last;})[0];
  var i = bottom.indexOf(p.n);
  if(i>=0) bottom.splice(i,1);
  delete p._in;
  window._last=null;
  document.getElementById('snack').className='snack';
  render();
});

document.getElementById('q').addEventListener('input', function(){
  document.getElementById('f1').className = 'field'+(this.value?' has':'');
  render();
});
document.getElementById('qx').addEventListener('click', function(){
  document.getElementById('q').value='';
  document.getElementById('f1').className='field';
  render();
});

document.getElementById('pg-back').addEventListener('click', function(){
  document.getElementById('v-page').className='view';
  document.getElementById('v-more').className='view on';
});

document.getElementById('go-set').addEventListener('click', function(){
  toast('调序和移回在「设置 → 底部导航栏」');
});

Array.prototype.forEach.call(document.querySelectorAll('.nv'), function(b){
  b.addEventListener('click', function(){
    var n=b.getAttribute('data-nav');
    if(n==='更多'){ return; }
    toast('「'+n+'」是另一个原型页，这里跳不过去');
  });
});

render();
</script>
</body>
</html>
