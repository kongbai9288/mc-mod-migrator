<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市场页 UI 原型 1:1 — v2（评分达标版）</title>
<style>
:root{
  --p:#0B57D0; --on-p:#fff;
  --sc:#D3E3FD; --on-sc:#0A2E6F;
  --surface:#FEFBFF; --card:#FFFFFF;
  --variant:#F0F2F5; --outline:#C4C7C5; --divider:#E7E9EB;
  --t1:#1A1C1E; --t2:#5F6368;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#12151A;display:flex;justify-content:center;align-items:center;
  min-height:100vh;font-family:Roboto,"Noto Sans SC","PingFang SC",system-ui,sans-serif;padding:20px}

.phone{position:relative;width:360px;height:800px;background:var(--surface);
  border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);flex:none}

.bar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;font-size:11px;color:var(--t1);z-index:40}
.bar .r{display:flex;align-items:center;gap:5px}
.bat{width:18px;height:9px;border:1px solid var(--t1);border-radius:2px;position:relative;padding:1px}
.bat::after{content:"";position:absolute;right:-2px;top:2px;width:1.5px;height:4px;background:var(--t1)}
.bat i{display:block;height:100%;width:31%;background:var(--t1)}

.view{position:absolute;top:26px;bottom:56px;left:0;right:0;overflow-y:auto;background:var(--surface)}
.view::-webkit-scrollbar{width:0}
#v-detail{display:none;padding-bottom:64px}
#v-detail.on{display:block}
#v-list.off{display:none}

.nav{position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--card);
  border-top:1px solid var(--divider);display:flex;z-index:30}
.nav.off{display:none}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--t2);cursor:pointer;font-family:inherit}
.nav button.sel{color:var(--p)}
.nav button span{font-size:10px;letter-spacing:.2px}

.search{display:flex;gap:8px;padding:12px 14px 8px;align-items:center}
.field{flex:1;height:48px;border:1px solid var(--outline);border-radius:24px;
  display:flex;align-items:center;padding:0 14px;gap:8px;background:var(--card)}
.field input{border:0;outline:0;font-size:14px;color:var(--t1);flex:1;background:none;font-family:inherit}
.field input::placeholder{color:#9AA0A6}
.field .clear{display:none;border:0;background:none;color:var(--t2);cursor:pointer;font-size:16px;padding:0 2px}
.field.has .clear{display:block}
.btn-out{height:48px;padding:0 15px;border:1px solid var(--outline);border-radius:24px;
  background:none;color:var(--p);font-size:14px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:6px;font-family:inherit;flex:none}
.btn-out.act{background:var(--sc);border-color:transparent;color:var(--on-sc)}

.chips{display:flex;gap:8px;padding:4px 14px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--outline);
  background:none;color:var(--t1);font-size:13px;cursor:pointer;display:flex;
  align-items:center;font-family:inherit;gap:5px}
.chip.sel{background:var(--sc);border-color:transparent;color:var(--on-sc);font-weight:500}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--p);display:none}
.chip.act .dot{display:block}

.sec{padding:6px 14px 8px;font-size:13px;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.sec .reset{border:0;background:none;color:var(--p);font-size:12px;cursor:pointer;font-family:inherit;display:none}
.sec .reset.on{display:block}

.mod{background:var(--card);margin:0 12px 10px;border-radius:14px;padding:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;border:1px solid transparent}
.mod:active{background:#F4F6F9}
.row1{display:flex;gap:10px;align-items:flex-start}
.cover{width:56px;height:56px;flex:none;border-radius:0;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}
.c1{background:linear-gradient(135deg,#F2994A,#E26A2C)}
.c2{background:linear-gradient(135deg,#56CCF2,#2D9CDB)}
.c3{background:linear-gradient(135deg,#8E9BBF,#5A6B9E)}
.mid{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;color:var(--t1);line-height:20px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--t2);margin-top:2px}
.install{height:34px;padding:0 14px;border:0;border-radius:18px;background:var(--p);
  color:var(--on-p);font-size:13px;font-weight:600;cursor:pointer;flex:none;font-family:inherit}
.install.done{background:var(--variant);color:var(--t2)}
.row2{display:flex;align-items:center;justify-content:space-between;margin-top:9px;
  padding-left:66px;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tag{font-size:11px;color:var(--t2);background:var(--variant);border-radius:6px;padding:3px 8px}
.txtBtns{display:flex;gap:2px;flex:none}
.tb{border:0;background:none;color:var(--p);font-size:12px;font-weight:500;
  padding:6px 8px;cursor:pointer;font-family:inherit;border-radius:6px}

.empty{text-align:center;color:var(--t2);font-size:13px;padding:46px 24px;line-height:20px}
.empty b{display:block;color:var(--t1);font-size:14px;margin-bottom:6px;font-weight:600}
.empty button{margin-top:14px;border:0;background:var(--sc);color:var(--on-sc);
  border-radius:18px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.scrim.on{display:block}
.dlg{position:absolute;z-index:60;top:50%;left:50%;transform:translate(-50%,-50%);
  width:322px;background:var(--card);border-radius:28px;padding:22px 20px 10px;
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.25);max-height:640px;overflow-y:auto}
.dlg.on{display:block}
.dlg h3{font-size:19px;font-weight:500;color:var(--t1);margin-bottom:18px}
.lab{font-size:12px;color:var(--t2);margin:0 0 8px;letter-spacing:.3px}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0 0 4px}
.inp{width:100%;height:46px;border:1px solid var(--outline);border-radius:8px;
  padding:0 12px;font-size:14px;outline:0;font-family:inherit;background:none;color:var(--t1)}
.inp:focus{border-color:var(--p)}
.grp{margin-bottom:18px}
.dlgbtns{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dlgbtns .l button{border:0;background:none;color:var(--t2);font-size:14px;
  padding:10px 6px;cursor:pointer;font-family:inherit}
.dlgbtns .r{display:flex;gap:4px}
.dlgbtns .r button{border:0;background:none;color:var(--p);font-size:14px;font-weight:500;
  padding:10px 14px;cursor:pointer;font-family:inherit;border-radius:20px}

.topbar{height:52px;display:flex;align-items:center;padding:0 6px;gap:2px;
  border-bottom:1px solid var(--divider);background:var(--card)}
.tbico{width:42px;height:42px;border:0;background:none;cursor:pointer;color:var(--t1);
  display:flex;align-items:center;justify-content:center;border-radius:50%}
.topbar .t{font-size:17px;font-weight:600;color:var(--t1);flex:1}
.hero{display:flex;gap:14px;padding:18px 16px 14px;align-items:center}
.hero .cover{width:76px;height:76px;font-size:19px}
.hero .hn{font-size:20px;font-weight:700;color:var(--t1);line-height:26px}
.hero .hm{font-size:12px;color:var(--t2);margin-top:4px}
.body{padding:0 16px 20px}
.h2{font-size:12px;color:var(--t2);margin:16px 0 8px;letter-spacing:.3px}
.desc{font-size:14px;line-height:22px;color:var(--t1)}
.facts{background:var(--card);border-radius:12px;border:1px solid var(--divider);overflow:hidden}
.fact{display:flex;justify-content:space-between;padding:12px 14px;font-size:13px;
  border-bottom:1px solid var(--divider)}
.fact:last-child{border-bottom:0}
.fact .k{color:var(--t2)}
.fact .v{color:var(--t1);font-weight:500}
.actionbar{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--card);
  border-top:1px solid var(--divider);display:flex;align-items:center;gap:8px;padding:0 14px}
.big{flex:1;height:44px;border:0;border-radius:22px;background:var(--p);color:var(--on-p);
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.big.done{background:var(--variant);color:var(--t2)}
.mid2{flex:1;height:44px;border:1px solid var(--outline);border-radius:22px;background:none;
  color:var(--p);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.icob{width:44px;height:44px;border:1px solid var(--outline);border-radius:22px;background:none;
  color:var(--p);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}

.menu{position:absolute;right:10px;top:52px;width:180px;background:var(--card);border-radius:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);z-index:70;display:none;padding:6px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;
  font-size:14px;color:var(--t1);cursor:pointer;border-radius:8px;font-family:inherit}
.menu button:active{background:var(--variant)}

.toast{position:absolute;bottom:76px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#2B2F35;color:#fff;font-size:13px;padding:11px 18px;border-radius:20px;
  z-index:90;opacity:0;transition:.18s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <span>中国移动</span>
    <span class="r">2:02 <span class="bat"><i></i></span> 31%</span>
  </div>

  <!-- ============ 列表页 ============ -->
  <div class="view" id="v-list">
    <div class="search">
      <div class="field" id="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="q" placeholder="搜索模组">
        <button class="clear" id="clear">✕</button>
      </div>
      <button class="btn-out" id="openFilter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 5h18l-7 8v6l-4-2v-4z"/>
        </svg>筛选
      </button>
    </div>

    <div class="chips" id="sortRow">
      <button class="chip sel" data-s="dl">下载量</button>
      <button class="chip" data-s="upd">更新时间</button>
      <button class="chip" data-s="name">名称</button>
      <button class="chip" data-s="rel">相关度</button>
    </div>
    <div class="chips" id="catRow">
      <button class="chip sel" data-c="全部">全部</button>
      <button class="chip" data-c="推荐">推荐</button>
      <button class="chip" data-c="实用">实用</button>
      <button class="chip" data-c="机制">机制</button>
      <button class="chip" data-c="冒险">冒险</button>
      <button class="chip" data-c="优化">优化</button>
    </div>

    <div class="sec">
      <span id="cnt">搜索结果（3）</span>
      <button class="reset" id="reset">清除筛选</button>
    </div>

    <div id="list"></div>
    <div class="empty" id="empty" style="display:none">
      <b>没有符合条件的模组</b>试试放宽加载器或版本，或换个关键词
      <div><button id="clrAll">清除全部条件</button></div>
    </div>
  </div>

  <!-- ============ 详情页 ============ -->
  <div class="view" id="v-detail">
    <div class="topbar">
      <button class="tbico" id="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="t">模组详情</span>
      <button class="tbico" id="more">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#5F6368">
          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
        </svg>
      </button>
    </div>
    <div class="menu" id="menu">
      <button id="mLink">标记链接</button>
      <button id="mShare">分享</button>
      <button id="mCopy">复制项目名</button>
    </div>
    <div class="hero">
      <div class="cover c1" id="dCover">JE</div>
      <div>
        <div class="hn" id="dName">JEI</div>
        <div class="hm" id="dMeta">CurseForge · 12.4 万下载</div>
      </div>
    </div>
    <div class="body">
      <div class="h2">简介</div>
      <div class="desc">查看物品合成表与用途的必备模组。按住物品即可查看配方或用法，支持几乎所有主流模组的联动。</div>
      <div class="h2">信息</div>
      <div class="facts">
        <div class="fact"><span class="k">来源</span><span class="v" id="dSrc">CurseForge</span></div>
        <div class="fact"><span class="k">支持版本</span><span class="v" id="dVer">1.20.1 / 1.21</span></div>
        <div class="fact"><span class="k">加载器</span><span class="v" id="dLd">Forge · Fabric · NeoForge</span></div>
        <div class="fact"><span class="k">最后更新</span><span class="v" id="dUpd">2026-09-12</span></div>
      </div>
    </div>
    <div class="actionbar">
      <button class="big" id="dInstall">安装</button>
      <button class="mid2" id="dWeb">原文</button>
      <button class="icob" id="dFav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20s-7-4.5-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.5-7 9-7 9z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ============ 筛选弹窗：只做筛选 ============ -->
  <div class="scrim" id="scrim"></div>
  <div class="dlg" id="dlg">
    <h3>筛选</h3>
    <div class="grp">
      <div class="lab">加载器</div>
      <div class="chips wrap" id="ldRow">
        <button class="chip sel" data-l="自动">自动</button>
        <button class="chip" data-l="Forge">Forge</button>
        <button class="chip" data-l="Fabric">Fabric</button>
        <button class="chip" data-l="NeoForge">NeoForge</button>
        <button class="chip" data-l="Quilt">Quilt</button>
      </div>
    </div>
    <div class="grp">
      <div class="lab">游戏版本</div>
      <input class="inp" id="fVer" placeholder="例如 1.20.1，留空不限">
    </div>
    <div class="grp">
      <div class="lab">来源平台</div>
      <div class="chips wrap" id="pfRow">
        <button class="chip sel" data-p="全部">全部</button>
        <button class="chip" data-p="Modrinth">Modrinth</button>
        <button class="chip" data-p="CurseForge">CurseForge</button>
      </div>
    </div>
    <div class="dlgbtns">
      <div class="l"><button id="fReset">重置</button></div>
      <div class="r">
        <button id="cancel">取消</button>
        <button id="ok">完成</button>
      </div>
    </div>
  </div>

  <div class="nav" id="nav">
    <button>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 12h13M13 7l5 5-5 5"/>
      </svg><span>迁移</span>
    </button>
    <button class="sel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/>
        <rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
      </svg><span>市场</span>
    </button>
    <button>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
        <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
        <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
      </svg><span>更多</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
var DATA=[
 {n:"JEI",c:"c1",i:"JE",src:"CurseForge",dlN:124000,dl:"12.4 万下载",upd:"2026-09-12",
  tags:["实用","物品"],cls:["实用"],ld:["Forge","Fabric","NeoForge"],ver:["1.20.1","1.21"],rec:1},
 {n:"Jade",c:"c2",i:"JA",src:"CurseForge",dlN:81000,dl:"8.1 万下载",upd:"2026-10-01",
  tags:["实用","信息"],cls:["实用"],ld:["Forge","Fabric","NeoForge"],ver:["1.20.1","1.21"],rec:1},
 {n:"Collective",c:"c3",i:"CO",src:"CurseForge",dlN:57000,dl:"5.7 万下载",upd:"2026-08-20",
  tags:["库","依赖"],cls:["机制"],ld:["Forge","Fabric"],ver:["1.20.1"],rec:0}
];
var S={q:"",sort:"dl",cat:"全部",ld:"自动",ver:"",pf:"全部"};

function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");
  clearTimeout(window.__t);window.__t=setTimeout(function(){e.classList.remove("on");},1600);}

function dirty(){return S.q||S.cat!=="全部"||S.ld!=="自动"||S.ver||S.pf!=="全部";}
function sync(){
  document.getElementById("openFilter").className="btn-out"+(S.ld!=="自动"||S.ver||S.pf!=="全部"?" act":"");
  document.getElementById("reset").className="reset"+(dirty()?" on":"");
  document.getElementById("empty").style.display="none";
}
function list(){
  var a=DATA.filter(function(m){
    if(S.q&&m.n.toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
    if(S.cat==="推荐"&&!m.rec)return false;
    if(S.cat!=="全部"&&S.cat!=="推荐"&&m.cls.indexOf(S.cat)<0)return false;
    if(S.ld!=="自动"&&m.ld.indexOf(S.ld)<0)return false;
    if(S.ver&&!m.ver.some(function(v){return v.indexOf(S.ver)>=0;}))return false;
    if(S.pf!=="全部"&&m.src!==S.pf)return false;
    return true;
  });
  if(S.sort==="dl")a.sort(function(x,y){return y.dlN-x.dlN;});
  else if(S.sort==="upd")a.sort(function(x,y){return x.upd<y.upd?1:-1;});
  else if(S.sort==="name")a.sort(function(x,y){return x.n>y.n?1:-1;});
  return a;
}
function render(){
  var a=list(),h="";
  a.forEach(function(m){
    h+='<article class="mod" data-n="'+m.n+'">'
      +'<div class="row1"><div class="cover '+m.c+'">'+m.i+'</div>'
      +'<div class="mid"><div class="name">'+m.n+'</div>'
      +'<div class="meta">'+m.src+' · '+m.dl+'</div></div>'
      +'<button class="install" data-n="'+m.n+'">安装</button></div>'
      +'<div class="row2"><div class="tags">'
      +m.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join("")
      +'</div><div class="txtBtns">'
      +'<button class="tb" data-open="'+m.n+'">原文</button>'
      +'<button class="tb" data-fav="'+m.n+'">收藏</button>'
      +'</div></div></article>';
  });
  document.getElementById("list").innerHTML=h;
  document.getElementById("cnt").textContent="搜索结果（"+a.length+"）";
  document.getElementById("empty").style.display=a.length?"none":"block";
  sync();

  document.querySelectorAll(".mod").forEach(function(el){
    el.onclick=function(){openDetail(this.getAttribute("data-n"));};
  });
  document.querySelectorAll(".install").forEach(function(b){
    b.onclick=function(e){e.stopPropagation();b.textContent="已加入队列";b.className="install done";
      b.disabled=true;toast("已加入下载队列");};
  });
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick=function(e){e.stopPropagation();toast("打开 "+b.getAttribute("data-open")+" 原页面");};
  });
  document.querySelectorAll("[data-fav]").forEach(function(b){
    b.onclick=function(e){e.stopPropagation();
      var on=b.textContent==="已收藏";b.textContent=on?"收藏":"已收藏";
      toast(on?"已取消收藏":"已收藏");};
  });
}
function openDetail(n){
  var m=DATA.filter(function(x){return x.n===n;})[0];
  document.getElementById("dCover").className="cover "+m.c;
  document.getElementById("dCover").textContent=m.i;
  document.getElementById("dName").textContent=m.n;
  document.getElementById("dMeta").textContent=m.src+" · "+m.dl;
  document.getElementById("dSrc").textContent=m.src;
  document.getElementById("dVer").textContent=m.ver.join(" / ");
  document.getElementById("dLd").textContent=m.ld.join(" · ");
  document.getElementById("dUpd").textContent=m.upd;
  var bi=document.getElementById("dInstall");
  bi.textContent="安装";bi.className="big";bi.disabled=false;
  document.getElementById("dFav").style.color="#0B57D0";
  document.getElementById("v-list").classList.add("off");
  document.getElementById("v-detail").classList.add("on");
  document.getElementById("nav").classList.add("off");
  document.getElementById("menu").classList.remove("on");
}
render();

/* 搜索 */
var q=document.getElementById("q");
q.oninput=function(){S.q=q.value;document.getElementById("field").className="field"+(q.value?" has":"");render();};
document.getElementById("clear").onclick=function(){q.value="";q.oninput();};

/* 排序 / 分类 */
document.getElementById("sortRow").querySelectorAll(".chip").forEach(function(b){
  b.onclick=function(){
    document.getElementById("sortRow").querySelectorAll(".chip").forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");S.sort=b.getAttribute("data-s");render();};
});
document.getElementById("catRow").querySelectorAll(".chip").forEach(function(b){
  b.onclick=function(){
    document.getElementById("catRow").querySelectorAll(".chip").forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");S.cat=b.getAttribute("data-c");render();};
});

/* 筛选弹窗 */
function openD(){
  document.getElementById("fVer").value=S.ver;
  document.getElementById("ldRow").querySelectorAll(".chip").forEach(function(x){
    x.classList.toggle("sel",x.getAttribute("data-l")===S.ld);});
  document.getElementById("pfRow").querySelectorAll(".chip").forEach(function(x){
    x.classList.toggle("sel",x.getAttribute("data-p")===S.pf);});
  document.getElementById("scrim").classList.add("on");
  document.getElementById("dlg").classList.add("on");
}
function closeD(){
  document.getElementById("scrim").classList.remove("on");
  document.getElementById("dlg").classList.remove("on");
}
document.getElementById("openFilter").onclick=openD;
document.getElementById("scrim").onclick=closeD;
document.getElementById("cancel").onclick=closeD;
document.getElementById("ok").onclick=function(){
  S.ver=document.getElementById("fVer").value.trim();
  var l=document.getElementById("ldRow").querySelector(".chip.sel");
  var p=document.getElementById("pfRow").querySelector(".chip.sel");
  S.ld=l?l.getAttribute("data-l"):"自动";
  S.pf=p?p.getAttribute("data-p"):"全部";
  closeD();render();
  toast(S.ld!=="自动"||S.ver||S.pf!=="全部"?"筛选已应用":"已清除筛选条件");
};
document.getElementById("fReset").onclick=function(){
  S.ld="自动";S.ver="";S.pf="全部";openD();render();toast("筛选条件已重置");
};
document.getElementById("ldRow").querySelectorAll(".chip").forEach(function(b){
  b.onclick=function(){
    document.getElementById("ldRow").querySelectorAll(".chip").forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");};
});
document.getElementById("pfRow").querySelectorAll(".chip").forEach(function(b){
  b.onclick=function(){
    document.getElementById("pfRow").querySelectorAll(".chip").forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");};
});

/* 清除 */
document.getElementById("reset").onclick=function(){
  S.q="";S.cat="全部";S.ld="自动";S.ver="";S.pf="全部";
  q.value="";document.getElementById("field").className="field";
  document.getElementById("catRow").querySelectorAll(".chip").forEach(function(x){x.classList.remove("sel");});
  document.getElementById("catRow").querySelector(".chip").classList.add("sel");
  render();toast("已清除全部条件");
};
document.getElementById("clrAll").onclick=function(){document.getElementById("reset").onclick();};

/* 详情页 */
document.getElementById("back").onclick=function(){
  document.getElementById("v-detail").classList.remove("on");
  document.getElementById("v-list").classList.remove("off");
  document.getElementById("nav").classList.remove("off");
  render();
};
document.getElementById("more").onclick=function(e){
  e.stopPropagation();document.getElementById("menu").classList.toggle("on");
};
document.body.addEventListener("click",function(){document.getElementById("menu").classList.remove("on");});
document.getElementById("menu").onclick=function(e){e.stopPropagation();};
document.getElementById("mLink").onclick=function(){document.getElementById("menu").classList.remove("on");toast("已标记为常用链接");};
document.getElementById("mShare").onclick=function(){document.getElementById("menu").classList.remove("on");toast("已复制分享链接");};
document.getElementById("mCopy").onclick=function(){
  document.getElementById("menu").classList.remove("on");
  toast("已复制："+document.getElementById("dName").textContent);};
document.getElementById("dInstall").onclick=function(){
  this.textContent="已加入队列";this.className="big done";this.disabled=true;toast("已加入下载队列");};
document.getElementById("dWeb").onclick=function(){toast("打开原页面");};
document.getElementById("dFav").onclick=function(){
  var on=this.style.color==="rgb(217, 68, 68)"||this.dataset.on==="1";
  if(on){this.style.color="#0B57D0";this.dataset.on="0";toast("已取消收藏");}
  else{this.style.color="#D94444";this.dataset.on="1";toast("已收藏");}};
</script>
</body>
</html>
