<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>周报页原型</title>
<style>
:root{
  --p:#0B57D0; --on-p:#fff;
  --sc:#D3E3FD; --on-sc:#0A2E6F;
  --surface:#FEFBFF; --card:#FFFFFF;
  --variant:#F0F2F5; --outline:#C4C7C5; --divider:#E7E9EB;
  --t1:#1A1C1E; --t2:#5F6368; --t3:#9AA0A6;
  --warn:#8A4B00; --warn-bg:#FCE8CD; --warn-line:#F0B86B;
  --err:#B3261E; --err-bg:#F9DEDC;
  --ok:#006C51; --ok-bg:#D7F5EA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#12151A;display:flex;justify-content:center;align-items:center;
  min-height:100vh;font-family:Roboto,"Noto Sans SC","PingFang SC",system-ui,sans-serif;padding:20px;gap:24px;flex-wrap:wrap}

.phone{position:relative;width:360px;height:800px;background:var(--surface);
  border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);flex:none}

.bar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;font-size:11px;color:var(--t1);z-index:40}
.bar .r{display:flex;align-items:center;gap:5px}
.bat{width:18px;height:9px;border:1px solid var(--t1);border-radius:2px;position:relative;padding:1px}
.bat::after{content:"";position:absolute;right:-2px;top:2px;width:1.5px;height:4px;background:var(--t1)}
.bat i{display:block;height:100%;width:56%;background:var(--t1)}

.view{position:absolute;top:26px;bottom:0;left:0;right:0;overflow-y:auto;background:var(--surface)}
.view::-webkit-scrollbar{width:0}
.view{display:none}
.view.on{display:block}
.hasbar .view{bottom:56px}

.appbar{position:sticky;top:0;z-index:20;height:56px;background:var(--surface);
  display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--divider)}
.appbar .back{border:0;background:none;cursor:pointer;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;color:var(--t1);border-radius:50%}
.appbar h1{font-size:19px;font-weight:500;color:var(--t1);flex:1}
.appbar .act{border:0;background:none;color:var(--p);font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:0 12px;height:40px}
.appbar .act:disabled{color:var(--t3);cursor:default}

.note{margin:10px 12px;background:var(--variant);border-radius:12px;padding:11px 13px;
  font-size:12px;color:var(--t2);line-height:17px}
.note b{color:var(--t1);font-weight:600}
.warnbox{margin:10px 12px;background:var(--warn-bg);border:1px solid var(--warn-line);
  border-radius:12px;padding:11px 13px;font-size:12px;color:var(--warn);line-height:17px}
.errbox{margin:10px 12px;background:var(--err-bg);border-radius:12px;padding:11px 13px;
  font-size:12px;color:var(--err);line-height:17px}

.tabs{display:flex;gap:8px;padding:10px 12px 4px;position:sticky;top:56px;z-index:15;background:var(--surface)}
.tab{flex:1;height:40px;border-radius:20px;border:1px solid var(--outline);background:none;
  font-size:13px;color:var(--t2);cursor:pointer;font-family:inherit}
.tab.on{background:var(--sc);border-color:var(--sc);color:var(--on-sc);font-weight:600}
.tab .n{font-size:11px;opacity:.85}

.panel{display:none;padding-bottom:16px}
.panel.on{display:block}

.sec{padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--p);letter-spacing:.3px}
.grp{background:var(--card);margin:0 12px 12px;border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;min-height:64px;cursor:pointer}
.row:active{background:#F4F6F9}
.row+.row{border-top:1px solid var(--divider)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--variant);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--p)}
.ico svg{width:20px;height:20px;fill:currentColor}
.row .tx{flex:1;min-width:0;padding:10px 0}
.row .t{font-size:14px;color:var(--t1);line-height:19px}
.row .s{font-size:12px;color:var(--t2);margin-top:2px;line-height:16px}
.row .go{flex:none;color:var(--p);font-size:13px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px 12px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stat .v{font-size:24px;font-weight:600;color:var(--t1);line-height:30px}
.stat .v.bad{color:var(--err)}
.stat .k{font-size:12px;color:var(--t2);margin-top:2px}

.empty{padding:34px 20px;text-align:center;color:var(--t2);font-size:13px;display:none;line-height:19px}
.empty.on{display:block}
.empty b{display:block;color:var(--t1);font-size:15px;margin-bottom:6px}

.btn{height:48px;border:0;border-radius:24px;background:var(--p);color:var(--on-p);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn.ghost{background:none;color:var(--p);border:1px solid var(--outline)}
.btn:disabled{background:var(--variant);color:var(--t3);cursor:default}
.btnwrap{margin:0 12px 12px}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:18px;
  white-space:pre-wrap;word-break:break-all;color:var(--t1);
  background:var(--variant);border-radius:12px;padding:12px;margin:0 12px 12px}

.rl{background:var(--card);margin:0 12px 12px;border-radius:16px;padding:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rl .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rl .tag{font-size:15px;font-weight:600;color:var(--t1);flex:1}
.rl .dt{font-size:11px;color:var(--t3)}
.rl .bd{font-size:12px;color:var(--t2);line-height:17px;margin-top:6px}
.rl .acts{display:flex;gap:8px;margin-top:10px}
.rl .acts button{flex:1;height:44px;border-radius:12px;border:1px solid var(--outline);
  background:none;color:var(--p);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

.src{background:var(--card);margin:0 12px 12px;border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.src .sh{padding:12px 14px 8px;font-size:13px;font-weight:600;color:var(--t1);
  display:flex;align-items:center;gap:8px}
.src .sh .cnt{font-size:11px;color:var(--t3);font-weight:400}
.src .it{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;
  font-size:13px;color:var(--t1);line-height:18px;cursor:pointer;min-height:48px}
.src .it:active{background:#F4F6F9}
.src .it+.it{border-top:1px solid var(--divider)}
.src .it .d{width:6px;height:6px;border-radius:3px;background:var(--t3);flex:none;margin-top:6px}
.src .it .tt{flex:1;min-width:0}
.src .it .ar{color:var(--t3);flex:none;font-size:14px}

.foot{margin:6px 12px 12px;font-size:11px;color:var(--t3);line-height:16px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--outline);
  border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="phone">
  <div class="bar"><span>2:14</span><span class="r"><span>中国移动</span><span>4G</span><span class="bat"><i></i></span></span></div>

  <!-- 主页 -->
  <div class="view on" id="v-main">
    <div class="appbar">
      <h1>周报</h1>
      <button class="act" id="btnRefresh">刷新</button>
    </div>
    <div class="note" id="genNote">最近发生了什么。三个分区各取各的数据，一个拿不到不影响另外两个。<b id="genTime">生成于 10-18 14:20</b></div>
    <div class="tabs">
      <button class="tab on" data-p="local">本机动态<span class="n" id="nLocal"></span></button>
      <button class="tab" data-p="app">应用动态</button>
      <button class="tab" data-p="site">社区动态</button>
    </div>

    <!-- 本机动态 -->
    <div class="panel on" id="p-local">
      <div class="stats">
        <div class="stat"><div class="v" id="sTotal">—</div><div class="k">日志条目</div></div>
        <div class="stat"><div class="v bad" id="sErr">—</div><div class="k">其中错误</div></div>
        <div class="stat"><div class="v" id="sMig">—</div><div class="k">迁移相关</div></div>
        <div class="stat"><div class="v" id="sDl">—</div><div class="k">下载安装</div></div>
      </div>
      <div class="sec">最近的错误</div>
      <div class="grp" id="errList"></div>
      <div class="empty" id="empLocal"><b>暂无本地数据</b>用一阵子再来看就有了。</div>
      <div class="btnwrap"><button class="btn ghost" id="goLog">查看完整日志</button></div>
    </div>

    <!-- 应用动态 -->
    <div class="panel" id="p-app">
      <div id="appBox"></div>
      <div class="empty" id="empApp"></div>
      <div class="foot">来自 GitHub 仓库的 release 记录。点「查看原文」可打开完整更新说明。</div>
    </div>

    <!-- 社区动态 -->
    <div class="panel" id="p-site">
      <div id="siteBox"></div>
      <div class="empty" id="empSite"></div>
      <div class="foot">以上内容分别来自各站点，版权归原作者所有。点条目可跳转原文。</div>
    </div>
  </div>

  <!-- release 详情 -->
  <div class="view" id="v-release">
    <div class="appbar">
      <button class="back" data-back>←</button>
      <h1 id="rTag">v2.11.1</h1>
    </div>
    <div class="note"><b id="rDate">2026-10-18</b></div>
    <div class="mono" id="rBody"></div>
    <div class="btnwrap"><button class="btn" id="rOpen">查看原文</button></div>
  </div>

  <!-- 日志 -->
  <div class="view" id="v-log">
    <div class="appbar">
      <button class="back" data-back>←</button>
      <h1>日志</h1>
    </div>
    <div class="note">本机统计的来源。统计口径是按日志内容匹配关键词，不是精确计数。</div>
    <div class="mono" id="logBody"></div>
  </div>
</div>

<script>
var V={main:'v-main',release:'v-release',log:'v-log'};
function show(k){Object.keys(V).forEach(function(x){
  document.getElementById(V[x]).classList.toggle('on',x===k);});}
document.querySelectorAll('[data-back]').forEach(function(b){b.onclick=function(){show('main');};});

var DATA={
  local:{total:412,err:3,mig:27,dl:64,
    errs:[
      '迁移：源目录读取失败 permission denied',
      'Market：CurseForge 返回 429',
      'Sync：token 已过期'
    ],
    log:['10-18 14:02  E  迁移：源目录读取失败 permission denied',
         '10-18 14:01  E  Market：CurseForge 返回 429',
         '10-18 13:57  E  Sync：token 已过期',
         '10-18 13:40  I  已安装 jei-1.20.1',
         '10-18 13:38  I  迁移完成 42 个模组']
  },
  app:[
    {tag:'v2.11.1',date:'2026-10-18',body:'· 修 inline Composable 具名 return 导致的崩溃\n· 模组图标改正方形\n· 下拉弹窗补滚动\n· 市场筛选弹窗分区\n· 崩溃日志放宽截断长度'},
    {tag:'v2.11.0',date:'2026-10-18',body:'· 目录库：迁移前/后目录可多选、可切换\n· 补 PACKAGE_USAGE_STATS 声明\n· 版本号升级'},
    {tag:'v2.10.10',date:'2026-10-17',body:'· 工具箱改 Compose\n· 同步器产物落到公共 Download\n· 整合包导入引导页'}
  ],
  site:[
    {src:'MC 百科',items:['JEI 物品管理器更新到 1.20.1','暮色森林重制版发布']},
    {src:'Minecraft Wiki',items:['26.1 存档格式变更说明']},
    {src:'CurseForge',items:['Jade 15.1.0','Collective 7.2']}
  ]
};

function paintLocal(){
  var d=DATA.local;
  document.getElementById('sTotal').textContent=d.total;
  document.getElementById('sErr').textContent=d.err;
  document.getElementById('sMig').textContent=d.mig;
  document.getElementById('sDl').textContent=d.dl;
  var box=document.getElementById('errList');box.innerHTML='';
  document.getElementById('empLocal').classList.toggle('on',d.total===0);
  if(!d.errs.length){
    var e=document.createElement('div');e.className='empty on';
    e.innerHTML='<b>没有错误</b>最近没有记录到错误。';box.appendChild(e);return;
  }
  d.errs.forEach(function(m){
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<div class="ico"><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21z"/></svg></div>'+
      '<div class="tx"><div class="t" style="font-size:13px">'+m+'</div></div>';
    r.onclick=function(){show('log');};box.appendChild(r);
  });
}
function paintApp(){
  var box=document.getElementById('appBox');box.innerHTML='';
  var emp=document.getElementById('empApp');emp.classList.remove('on');
  if(!DATA.app.length){emp.innerHTML='<b>暂时拉不到更新记录</b>可能网络不通或仓库没发布过 release。'+
    '<div style="margin-top:10px"><button class="btn ghost" id="retryApp">重试</button></div>';
    emp.classList.add('on');
    document.getElementById('retryApp').onclick=function(){loadApp();};return;}
  DATA.app.forEach(function(r){
    var el=document.createElement('div');el.className='rl';
    el.innerHTML='<div class="hd"><span class="tag">'+r.tag+'</span><span class="dt">'+r.date+'</span></div>'+
      '<div class="bd">'+r.body.split('\n').slice(0,2).join('<br>')+
      (r.body.split('\n').length>2?' …':'')+'</div>'+
      '<div class="acts"><button data-full>看全文</button><button data-open>查看原文</button></div>';
    el.querySelector('[data-full]').onclick=function(){
      document.getElementById('rTag').textContent=r.tag;
      document.getElementById('rDate').textContent=r.date;
      document.getElementById('rBody').textContent=r.body;
      document.getElementById('rOpen').onclick=function(){};
      show('release');};
    el.querySelector('[data-open]').onclick=function(){};
    box.appendChild(el);
  });
}
function paintSite(){
  var box=document.getElementById('siteBox');box.innerHTML='';
  var emp=document.getElementById('empSite');emp.classList.remove('on');
  if(!DATA.site.length){emp.innerHTML='<b>暂时抓不到社区动态</b>可能网络不通，或站点改版导致解析失效。'+
    '<div style="margin-top:10px"><button class="btn ghost" id="retrySite">重试</button></div>';
    emp.classList.add('on');
    document.getElementById('retrySite').onclick=function(){loadSite();};return;}
  DATA.site.forEach(function(g){
    var s=document.createElement('div');s.className='src';
    s.innerHTML='<div class="sh">'+g.src+'<span class="cnt">'+g.items.length+' 条</span></div>';
    g.items.forEach(function(t){
      var it=document.createElement('div');it.className='it';
      it.innerHTML='<span class="d"></span><span class="tt">'+t+'</span><span class="ar">›</span>';
      it.onclick=function(){};s.appendChild(it);});
    box.appendChild(s);
  });
}
function loadApp(){
  var box=document.getElementById('appBox');
  box.innerHTML='<div class="note"><span class="spin"></span> 正在拉取 release…</div>';
  setTimeout(paintApp,400);
}
function loadSite(){
  var box=document.getElementById('siteBox');
  box.innerHTML='<div class="note"><span class="spin"></span> 正在抓取站点…</div>';
  setTimeout(paintSite,400);
}
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
    var p=t.dataset.p;
    ['local','app','site'].forEach(function(k){
      document.getElementById('p-'+k).classList.toggle('on',k===p);});
  };});
document.getElementById('btnRefresh').onclick=function(){
  var b=this;b.disabled=true;b.textContent='刷新中';
  document.getElementById('genTime').innerHTML='<span class="spin"></span> 正在生成';
  document.getElementById('genNote').classList.remove('note');
  loadApp();paintLocal();
  setTimeout(function(){
    b.disabled=false;b.textContent='刷新';
    document.getElementById('genTime').textContent='生成于 10-18 14:26';},1200);
};
document.getElementById('goLog').onclick=function(){
  document.getElementById('logBody').textContent=DATA.local.log.join('\n');show('log');};
paintLocal();paintApp();paintSite();
</script>
</body>
</html>
