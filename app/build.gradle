plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kongbai.modmigrator'
    compileSdk 34

    defaultConfig {
        applicationId "com.kongbai.modmigrator"
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName "2.2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "Wl001971@"
            keyAlias System.getenv("KEY_ALIAS") ?: "kbs"
            keyPassword System.getenv("KEY_PASS") ?: "Wl001971@"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ML Kit 的翻译模型不能被压缩，否则加载失败
    aaptOptions {
        noCompress "tflite", "lite"
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // FTP / FTPS：Apache Commons Net（Apache-2.0，非传染性）
    implementation 'commons-net:commons-net:3.11.1'
    // SFTP：sshj（Apache-2.0，非传染性）
    implementation 'com.hierynomus:sshj:0.38.0'
    //
    // ⚠️ Conscrypt 是 sshj 在 Android 上的**硬性依赖**，不是可选项。
    // sshj 走 BouncyCastle 做 SHA-256 / ECDSA / Ed25519 这些运算，
    // 但 Android 内置的 BC 是阉割版：从 Android P 起不再提供
    // MessageDigest.SHA-256 等算法（官方专门发文说明的变更）。
    // 结果就是连现代 SSH 服务器必定抛：
    //   "The BC provider no longer provides an implementation for
    //    MessageDigest.SHA-256"
    // ——不是服务器的问题，也不是账号密码的问题，就是缺这个 provider。
    // 装上它并在 App 里 insertProviderAt 之后才能握手成功。
    // （Apache-2.0，非传染性）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // TOML 解析（Forge/NeoForge 的 mods.toml）。Apache-2.0，无外部依赖，
    // 自带重定位过的 ANTLR 运行时，不会和别的库冲突。
    // 之前用正则去 grep mods.toml，嵌套表和数组根本解析不出来。
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'io.coil-kt:coil:2.5.0'

    // 离线翻译引擎（Google 官方，模型下载后完全离线可用，50+ 语言）
    implementation 'com.google.mlkit:translate:17.0.3'

    // ---- 以下为成熟第三方库，全部 Apache-2.0 / MIT（无高传染性）----
    // 目的：把之前自己手写的那套替换掉。自己写的版本在各种边界情况下
    // 反复出问题，而这些库经过大量项目验证。

    // 日志：替代散落各处的 println 与静默 catch，便于定位问题
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // 图片加载（含 SVG / GIF / WebP 解码），替代手写图片加载与缩放
    implementation 'io.coil-kt:coil-svg:2.5.0'
    implementation 'io.coil-kt:coil-gif:2.5.0'

    // 说明：下载库（Fetch）与依赖注入（Koin）这次**没有**引入。
    // 它们要真正发挥作用必须重写 Downloader / 全站构造方式，
    // 在没法真机验证的情况下贸然替换，只会把"能用的"也搞坏。
    // 等登录与基础功能稳定后再单独做。
    // HTTP 日志拦截（仅 debug 用），便于看请求到底发出去没有
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ---- NBT 与数据包生成器（MIT，非传染性）----
    // vianbt：ViaNBT 的零依赖安卓版，读写 Minecraft 的 .dat / .nbt
    // misode-android：misode.github.io 的 137 个生成器整站离线打包（WebView）
    // 两个 AAR 由 CI 在编译前下载到 app/libs/（见 .github/workflows/build-apk.yml），
    // 不进 git —— 仓库里放二进制会持续占用存储配额。
    implementation files('libs/vianbt-release.aar')
    implementation files('libs/misode-android-release.aar')
    // misode-android 依赖 androidx.webkit（WebViewAssetLoader）
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
