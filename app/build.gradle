plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kongbai.modmigrator'
    compileSdk 34

    defaultConfig {
        applicationId "com.kongbai.modmigrator"
        minSdk 26
        targetSdk 34
        versionCode 41
        versionName "2.3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "Wl001971@"
            keyAlias System.getenv("KEY_ALIAS") ?: "kbs"
            keyPassword System.getenv("KEY_PASS") ?: "Wl001971@"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ML Kit 的翻译模型不能被压缩，否则加载失败
    aaptOptions {
        noCompress "tflite", "lite"
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // FTP / FTPS：Apache Commons Net（Apache-2.0，非传染性）
    implementation 'commons-net:commons-net:3.11.1'
    // SFTP：sshj（Apache-2.0，非传染性）
    implementation 'com.hierynomus:sshj:0.38.0'
    //
    // ⚠️ Conscrypt 是 sshj 在 Android 上的**硬性依赖**，不是可选项。
    // sshj 走 BouncyCastle 做 SHA-256 / ECDSA / Ed25519 这些运算，
    // 但 Android 内置的 BC 是阉割版：从 Android P 起不再提供
    // MessageDigest.SHA-256 等算法（官方专门发文说明的变更）。
    // 结果就是连现代 SSH 服务器必定抛：
    //   "The BC provider no longer provides an implementation for
    //    MessageDigest.SHA-256"
    // ——不是服务器的问题，也不是账号密码的问题，就是缺这个 provider。
    // 装上它并在 App 里 insertProviderAt 之后才能握手成功。
    // （Apache-2.0，非传染性）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // TOML 解析（Forge/NeoForge 的 mods.toml）。Apache-2.0，无外部依赖，
    // 自带重定位过的 ANTLR 运行时，不会和别的库冲突。
    // 之前用正则去 grep mods.toml，嵌套表和数组根本解析不出来。
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'io.coil-kt:coil:2.5.0'

    // 离线翻译引擎（Google 官方，模型下载后完全离线可用，50+ 语言）
    implementation 'com.google.mlkit:translate:17.0.3'

    // ---- 以下为成熟第三方库，全部 Apache-2.0 / MIT（无高传染性）----
    // 目的：把之前自己手写的那套替换掉。自己写的版本在各种边界情况下
    // 反复出问题，而这些库经过大量项目验证。

    // 日志：替代散落各处的 println 与静默 catch，便于定位问题
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // 图片加载（含 SVG / GIF / WebP 解码），替代手写图片加载与缩放
    implementation 'io.coil-kt:coil-svg:2.5.0'
    implementation 'io.coil-kt:coil-gif:2.5.0'

    // ── 云盘：OpenList Android SDK ──────────────────────────────
    // 一个 SDK 覆盖 20+ 种后端（阿里云盘 / 百度网盘 / 夸克 / 天翼 /
    // 123 / 115 / Google Drive / OneDrive / WebDAV / S3 等），
    // 不用为每一家单独接 SDK、也不用各家单独申请 key。
    // bridge 是 gomobile 编译产物（13MB），不进仓库，由 CI 拉取。
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation files('libs/openlistbridge.aar')

    // 说明：下载库（Fetch）与依赖注入（Koin）这次**没有**引入。
    // 它们要真正发挥作用必须重写 Downloader / 全站构造方式，
    // 在没法真机验证的情况下贸然替换，只会把"能用的"也搞坏。
    // 等登录与基础功能稳定后再单独做。
    // HTTP 日志拦截（仅 debug 用），便于看请求到底发出去没有
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ---- NBT 与数据包生成器（MIT，非传染性）----
    //
    // ⚠️ 之前是以 AAR 形式在编译期引入（vianbt + misode-android），
    // 但 AAR 是**黑盒**：里面的类打没打进去、资源带没带上，
    // 出问题时本地也验证不了，只能靠猜。反馈里"还是没办法用"
    // 正是这种不可见性造成的。
    //
    // 现在改成**源码级融合**：
    //   · com/viaversion/nbt/**      —— ViaNBT 全部 40 个源文件，直接进本工程编译
    //   · io/misode/mobile/**        —— MisodeView 与事件模型，同样进本工程编译
    // 两者都是 MIT，许可已在「设置 → 关于 → 开源许可」中单独声明。
    // 好处：能读、能改、能断点，不会再出现"编译过了但功能残缺"。
    //
    // 网页生成器所需的静态资源（HTML/JS/JSON）不是代码，
    // 由 CI 从上游发布页取 misode-web-assets.zip 解压到 assets/misode/。
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    // ViaNBT 源码里用了 org.jetbrains.annotations.Nullable，
    // 融合进本工程后这个注解必须有出处，否则整包编译不过。
    implementation 'org.jetbrains:annotations:24.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
