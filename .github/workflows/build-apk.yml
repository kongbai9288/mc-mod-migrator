name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sSL --retry 3 -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          if [ -d "$HOME/android-sdk/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$HOME/android-sdk/cmdline-tools/latest"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -sSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Decode keystore
        run: |
          set -e
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          ls -la app/release.jks

      - name: Build APK
        env:
          KEYSTORE_FILE: app/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          gradle assembleRelease --no-daemon > /tmp/build.log 2>&1
          gradle assembleDebug --no-daemon >> /tmp/build.log 2>&1
          echo "EXIT=$?"
          echo "===== apk find ====="
          find . -name "*.apk" -type f -exec ls -la {} \;
          echo "===== last 60 lines ====="
          tail -60 /tmp/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ModMigrator-debug
          path: app/build/outputs/apk/*/*.apk
          retention-days: 30

      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, glob, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = 'https://api.github.com'
          up = 'https://uploads.github.com'


          def req(method, url, payload=None):
              data = json.dumps(payload).encode('utf-8') if payload is not None else None
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header('Authorization', 'Bearer ' + token)
              r.add_header('Accept', 'application/vnd.github+json')
              r.add_header('User-Agent', 'ci')
              if data:
                  r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      return json.loads(resp.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  return {'__error__': e.code, 'body': e.read().decode('utf-8', 'ignore')[:300]}
              except Exception as e:
                  return {'__error__': 0, 'body': str(e)[:200]}


          apks = glob.glob('app/build/outputs/apk/release/*.apk') or glob.glob('app/build/outputs/apk/debug/*.apk')
          print('found apks:', apks)
          if not apks:
              print('NO APK')
              raise SystemExit(0)

          apk = apks[0]
          print('apk', apk, os.path.getsize(apk))

          cur = req('GET', '%s/repos/%s/releases/tags/nightly' % (api, repo))
          if isinstance(cur, dict) and cur.get('id'):
              req('DELETE', '%s/repos/%s/releases/%s' % (api, repo, cur['id']))
          req('DELETE', '%s/repos/%s/git/refs/tags/nightly' % (api, repo))

          rel = req('POST', '%s/repos/%s/releases' % (api, repo), {
              'tag_name': 'nightly',
              'name': 'ModMigrator debug 构建',
              'body': 'CI 自动构建的 debug APK。安装后需在设置里填写自己的 GitHub Token、私有仓库；服务器页需填面板地址与 Client API Key。',
              'draft': False, 'prerelease': True,
          })
          if '__error__' in rel:
              print('RELEASE FAIL', rel)
              raise SystemExit(0)
          print('release', rel.get('id'))

          data = open(apk, 'rb').read()
          r = urllib.request.Request(
              '%s/repos/%s/releases/%s/assets?name=ModMigrator-debug.apk' % (up, repo, rel['id']),
              data=data, method='POST')
          r.add_header('Authorization', 'Bearer ' + token)
          r.add_header('Content-Type', 'application/vnd.android.package-archive')
          r.add_header('Accept', 'application/vnd.github+json')
          r.add_header('User-Agent', 'ci')
          try:
              with urllib.request.urlopen(r, timeout=300) as resp:
                  a = json.loads(resp.read().decode('utf-8'))
                  print('ASSET OK', a.get('name'), a.get('size'), a.get('browser_download_url'))
          except urllib.error.HTTPError as e:
              print('ASSET FAIL', e.code, e.read().decode('utf-8', 'ignore')[:300])
          PYEOF

      - name: Publish build log to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, base64, urllib.request, urllib.error, os

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = 'https://api.github.com'
          path = 'ci/build.log'


          def req(method, url, payload=None):
              data = json.dumps(payload).encode('utf-8') if payload is not None else None
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header('Authorization', 'Bearer ' + token)
              r.add_header('Accept', 'application/vnd.github+json')
              r.add_header('User-Agent', 'ci')
              if data:
                  r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      return json.loads(resp.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  return {'__error__': e.code, 'body': e.read().decode('utf-8', 'ignore')[:200]}
              except Exception as e:
                  return {'__error__': 0, 'body': str(e)[:150]}


          content = open('/tmp/build.log', 'rb').read()
          if len(content) > 900000:
              content = content[-900000:]
          cur = req('GET', '%s/repos/%s/contents/%s?ref=main' % (api, repo, path))
          print('GET', str(cur)[:120])
          payload = {'message': 'ci: build log', 'content': base64.b64encode(content).decode(), 'branch': 'main'}
          if isinstance(cur, dict) and cur.get('sha'):
              payload['sha'] = cur['sha']
          res = req('PUT', '%s/repos/%s/contents/%s' % (api, repo, path), payload)
          print('PUT', str(res)[:200])
          PYEOF
