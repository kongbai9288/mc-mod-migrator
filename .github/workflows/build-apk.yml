name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sSL --retry 3 -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          if [ -d "$HOME/android-sdk/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$HOME/android-sdk/cmdline-tools/latest"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -sSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -x lint 2>&1 | tail -100

      - name: Diagnose outputs
        if: always()
        run: |
          echo "PWD: $(pwd)" > /tmp/diag.txt
          echo "--- gradle version ---" >> /tmp/diag.txt
          gradle --version >> /tmp/diag.txt 2>&1
          echo "--- find apk ---" >> /tmp/diag.txt
          find . -name "*.apk" -type f >> /tmp/diag.txt 2>&1
          echo "--- ls outputs ---" >> /tmp/diag.txt
          ls -laR app/build/outputs >> /tmp/diag.txt 2>&1
          echo "--- ls build ---" >> /tmp/diag.txt
          ls -la app/build >> /tmp/diag.txt 2>&1
          echo "--- env ---" >> /tmp/diag.txt
          echo "ANDROID_HOME=$ANDROID_HOME" >> /tmp/diag.txt
          tail -60 /tmp/diag.txt

      - name: Upload diag to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          B64=$(base64 -w0 /tmp/diag.txt)
          printf '{"message":"ci: diag","content":"%s","branch":"main"}' "$B64" > /tmp/payload.json
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/payload.json \
            https://api.github.com/repos/${{ github.repository }}/contents/ci/diag.txt | head -c 300
