name: Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sSL --retry 3 -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          if [ -d "$HOME/android-sdk/cmdline-tools/cmdline-tools" ]; then
            rm -rf "$HOME/android-sdk/cmdline-tools/latest"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          set +e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "--- emulator pkg ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator" 2>&1 | tail -5
          echo "--- system image ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-34;google_apis;x86_64" 2>&1 | tail -10
          echo "--- installed ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1 | tail -20
          set -e

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -sSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon 2>&1 | tail -30

      - name: Run app on emulator and capture crash
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: smoke
          disable-animations: true
          disable-spellchecker: true
          profile: pixel_2
          script: |
            set +e
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk > /tmp/install.txt 2>&1 || adb install -r app/build/outputs/apk/debug/app-debug.apk > /tmp/install.txt 2>&1
            cat /tmp/install.txt > /tmp/logcat.txt
            echo "=== START ===" >> /tmp/logcat.txt
            adb shell am start -n com.kongbai.modmigrator/.MainActivity >> /tmp/logcat.txt 2>&1
            sleep 25
            for i in 1 2 3 4 5 6; do
              adb shell input tap 200 1800
              sleep 4
            done
            adb logcat -d -v time >> /tmp/logcat.txt 2>&1
            echo "=== PULL TO REPO ===" >> /tmp/logcat.txt
            mkdir -p out
            grep -E "FATAL EXCEPTION|AndroidRuntime|Unable to start|Unable to resume|Error inflating|NullPointerException|IllegalStateException|ClassNotFound|NoSuchMethod|Caused by|Process: com.kongbai" /tmp/logcat.txt | head -120 > out/smoke.txt || true
            wc -l out/smoke.txt

      - name: Publish smoke result to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          python3 - <<'PYEOF'
          import json, base64, os, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = 'https://api.github.com'

          def req(m, u, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(u, data=data, method=m)
              r.add_header('Authorization', 'Bearer ' + token)
              r.add_header('Accept', 'application/vnd.github+json')
              r.add_header('User-Agent', 'ci')
              if data:
                  r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return json.loads(x.read().decode())
              except urllib.error.HTTPError as e:
                  return {'__e': e.code}
              except Exception as e:
                  return {'__e': str(e)[:100]}

          txt = ''
          try:
              txt = open('out/smoke.txt', encoding='utf-8', errors='ignore').read()
          except Exception:
              txt = '(no logcat)'

          keep = []
          for line in txt.split('\n'):
              if any(k in line for k in [
                  'FATAL EXCEPTION', 'AndroidRuntime', 'Unable to start activity',
                  'Unable to resume', 'Error inflating', 'Caused by',
                  'java.lang.', 'android.view.', 'Process: com.kongbai',
                  'Force finishing', 'D/AndroidRuntime', 'E/AndroidRuntime',
                  'NullPointerException', 'IllegalStateException',
                  'ClassNotFoundException', 'NoSuchMethodError'
              ]):
                  keep.append(line.strip()[:300])
          out = '\n'.join(keep[:300]) or '(no crash keywords found)'

          cur = req('GET', '%s/repos/%s/contents/ci/smoke.txt?ref=main' % (api, repo))
          payload = {'message': 'ci: smoke', 'content': base64.b64encode(out.encode()).decode(), 'branch': 'main'}
          if isinstance(cur, dict) and cur.get('sha'):
              payload['sha'] = cur['sha']
          print('PUT', req('PUT', '%s/repos/%s/contents/ci/smoke.txt' % (api, repo), payload))
          PYEOF
